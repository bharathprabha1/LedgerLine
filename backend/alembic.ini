# LedgerLine - Alembic Database Migration Configuration

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
truncate_slug_length = 40
output_encoding = utf-8

# Database URL is loaded securely from backend/.env
# through migrations/env.py.

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
